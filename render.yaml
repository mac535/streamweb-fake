services:
  # ── Backend API (Node.js Web Service) ──
  - type: web
    name: streamweb-fake-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start -w server
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 5000

  # ── Frontend (Static Site) ──
  - type: web
    name: streamweb-fake-front
    runtime: static
    plan: free
    buildCommand: npm install && npm run build -w client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://streamweb-fake-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
