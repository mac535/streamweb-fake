<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffc107">
  <title>STREAM Ecosystem | Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: #fdfbf7;
      color: #1a1c1c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    /* Subtle animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 20% 30%, rgba(255, 193, 7, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 500px 500px at 80% 70%, rgba(120, 89, 0, 0.05) 0%, transparent 70%);
      z-index: -1;
      animation: bgShift 12s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.1) rotate(2deg); }
    }

    .card {
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.04);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.02);
      animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      opacity: 0.9;
    }

    .icon-offline {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: #f3f3f4;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.2); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(255, 193, 7, 0); }
    }

    .icon-offline svg {
      width: 32px;
      height: 32px;
      stroke: #785900;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #1a1c1c;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      color: #5f5e5e;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffc107;
      color: #6d5100;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 32px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(255, 193, 7, 0.25);
    }

    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 193, 7, 0.3);
    }

    .btn-retry:active {
      transform: scale(0.98);
    }

    .btn-retry svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.3s ease;
    }

    .btn-retry:hover svg {
      transform: rotate(180deg);
    }

    .brand {
      margin-top: 32px;
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: #d4c5ab;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo-1.png" alt="STREAM Logo" onerror="this.style.display='none'">

    <div class="icon-offline">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Check your network and try again to access the STREAM Ecosystem.</p>

    <button class="btn-retry" onclick="window.location.reload()">
      <svg viewBox="0 0 24 24">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      Try Again
    </button>

    <div class="brand">STREAM Ecosystem</div>
  </div>
</body>
</html>
